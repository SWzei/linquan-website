server {
  listen 80;
  listen [::]:80;
  server_name __SERVER_NAME__;

  # Must exceed the backend's combined upload budget (MAX_UPLOAD_REQUEST_BYTES,
  # default 64 MB) plus multipart overhead, or large valid uploads fail with an
  # HTML 413 page instead of the backend's JSON error.
  client_max_body_size 70m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location / {
    proxy_pass http://127.0.0.1:__NODE_PORT__;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
